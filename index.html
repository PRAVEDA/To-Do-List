<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>

  <style>

body {
  font-family: Arial, sans-serif;
  padding: 20px;
  background: #111; 
  min-height: 100px;
  color: #e6e6e6;
}


.input-area {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-top: 20px;
}

h2 {
  text-align: center;
  color: #ffffff;
  margin-bottom: 20px;
  font-size: 28px;
  font-weight: 600;
}


#taskInput {
  padding: 10px;
  width: 400px;
  border: 2px solid #444;
  border-radius: 6px;
  font-size: 15px;
  background: #1b1b1b;
  color: #fff;
  transition: 0.3s;
  text-align: center;
}

#taskInput:focus {
  border-color: #00aaff;
  outline: none;
  box-shadow: 0 0 8px #0088dd;
}


#addBtn {
  padding: 10px 16px;
  cursor: pointer;
  background: #00aaff;
  color: #111;
  border: none;
  border-radius: 6px;
  font-size: 15px;
  transition: 0.3s;
  font-weight: 600;
}

#addBtn:hover {
  background: #0088dd;
}


ul {
  margin-top: 25px;
  padding: 0;
  list-style: none;
}


li {
  padding: 12px;
  background: #1e1e1e;
  margin-bottom: 12px;
  cursor: pointer;
  border-radius: 10px;
  transition: 0.25s;
  font-size: 17px;
  border-left: 5px solid #00aaff;
  box-shadow: 0px 3px 6px rgba(0,0,0,0.4);
  color: #e1e1e1;
}

li:hover {
  transform: scale(1.02);
  background: #2a2a2a;
}


li.done {
  text-decoration: line-through;
  background: #162f18 !important;
  border-left: 5px solid #2ecc71;
  color: #88ff99;
}

  </style>
</head>
<body>

  <h2>To-Do List</h2>

  <div class="input-area">
    <input id="taskInput" type="text" placeholder="Add a task..." />
    <button id="addBtn">Add</button>
  </div>

  <ul id="taskList"></ul>

  <audio id="woohooSound" src="woohoo.mp3"></audio>

  <script>
    const addBtn = document.getElementById("addBtn");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");

    const sound = document.getElementById("woohooSound");

    function playWoohoo() {
      sound.currentTime = 0;
      sound.play();
    }

    addBtn.addEventListener("click", () => {
      const text = taskInput.value.trim();
      if (text === "") return;

      const li = document.createElement("li");
      li.textContent = text;

      li.addEventListener("click", () => {
        li.classList.toggle("done");
        playWoohoo();
      });

      taskList.appendChild(li);
      taskInput.value = "";
    });
  </script>

</body>
</html>
